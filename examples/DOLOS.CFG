# DOLOS.CFG - drop this in the root of the microSD card. All keys are optional.
# Authorized security testing only.

# --- injection ---
layout=us              # us | uk | de | fr | es   (keyboard layout of the TARGET)
speed=balanced         # fast | balanced | reliable
defaultdelay=0         # ms between commands unless the payload overrides
dryrun=off             # on = preview keystrokes on the LCD, send nothing

# --- on-device arming ---
armpin=                # e.g. 231 -> tap-dialed code required to arm (digits 1-9)

# --- USB identity (authorized allow-list testing; blank = Dolos default) ---
usb_vid=               # e.g. 0x1234
usb_pid=               # e.g. 0x5678
usb_mfr=
usb_product=

# --- wireless console (v0.3) ---
wifi=off               # ap | off      (SoftAP + secure web console)
wifi_ssid=             # blank -> Dolos-XXXX
wifi_pass=             # WPA2 passphrase, 8+ chars REQUIRED to start the AP
admin_user=admin
admin_pass=            # blank -> a random password is shown on the LCD at boot
remote_fire=off        # off = console can manage/edit only; the admin can still
                       # enable remote fire live from the console (LCD then shows
                       # a persistent REMOTE FIRE ARMED banner). Physical BOOT
                       # arming always works regardless of this setting.
