# DOLOS.CFG - drop this in the root of the microSD card. All keys are optional.
# Authorized security testing only.

# --- injection ---
layout=us              # us uk de fr es it pt se ch latam  (TARGET keyboard layout)
os=windows             # windows | linux | mac   (for Unicode "type anything")
speed=balanced         # fast | balanced | reliable
defaultdelay=0         # ms between commands unless the payload overrides
dryrun=off             # on = preview keystrokes on the LCD, send nothing

# --- on-device arming ---
armpin=                # e.g. 231 -> tap-dialed code required to arm (digits 1-9)

# --- USB identity (authorized allow-list testing; blank = Dolos default) ---
usb_vid=               # e.g. 0x1234
usb_pid=               # e.g. 0x5678
usb_mfr=
usb_product=

# --- wireless console ---
wifi=ap                # ap | off      (ON by default; SoftAP + secure console)
wifi_ssid=             # blank -> Dolos-XXXX (from the MAC)
wifi_pass=             # blank -> a random 10-char key is generated on first
                       # boot, kept in NVS, and shown on the LCD
admin_user=admin
admin_pass=            # blank -> a random 8-char password, also shown on the LCD

# --- on-device UI ---
ui_lock=off            # off  = everything reachable
                       # menu = no settings menu (payload can still be switched)
                       # full = no menu AND no payload switching - the device
                       #        does exactly the one job it was configured for
                       # ("on" is accepted and means "menu".) Arming, firing and
                       # the console are unaffected at every level.
remote_fire=off        # off = console can manage/edit only; the admin can still
                       # enable remote fire live from the console (LCD then shows
                       # a persistent REMOTE FIRE ARMED banner). Physical BOOT
                       # arming always works regardless of this setting.

# --- shared storage (ATTACKMODE HID STORAGE) -----------------------------
# Which MBR partition of the microSD card is handed to the host when a payload
# runs ATTACKMODE HID STORAGE. ONLY this partition is exposed - the host cannot
# address a sector outside it, so payloads, audit logs and boot logs on
# partition 1 stay invisible.
#
# The card needs two partitions for this. On macOS:
#   diskutil partitionDisk /dev/diskN MBR FAT32 DOLOS 60% FAT32 SHARE 40%
# Partition 1 (DOLOS) holds your payloads; partition 2 (SHARE) is the share.
#
# Nothing is exposed until a payload asks. While it is exposed the device stops
# writing to the card entirely - two writers on one filesystem corrupts it - and
# the screen carries a STORAGE SHARED banner for as long as it lasts.
storage_partition=2
